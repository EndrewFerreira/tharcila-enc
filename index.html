
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oi Tharcila</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #810130,
                #43015d,
                #140005
            );

            overflow: hidden;
        }

        .box {
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            text-align: center;
            background: rgb(26, 23, 23);
            border-radius: 25px;

            box-shadow: 0 10px 35px rgba(36, 1, 1, 0.12);
        }

        .coracao {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #a90e5b;
            font-size: 27px;
            margin-bottom: 15px;
        }

        h2 {
            color: #cdcdcd;
            font-size: 21px;
            line-height: 1.4;
            margin: 25px 0;
        }

        p {
            color: #777;
            font-size: 16px;
            line-height: 1.5;
        }

        .opcoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 16px 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            min-width: 115px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #sim {
            background: #28a745;
            color: white;
        }

        #nao {
            background: #dc3545;
            color: white;
            transition: left 0.1s ease, top 0.4s ease;
        }

        .area {
            min-height: 110px;
            padding: 25px 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 2px dashed #d63384;
            border-radius: 18px;

            background: #ffe3f1;
            color: #5e3248;

            font-size: 16px;
            font-weight: bold;
        }

        #resultado {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            background: #fff0f5;
            animation: aparecer 0.6s ease;
        }

        #resultado h2 {
            color: #d63384;
        }

        #resultado p {
            color: #555;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Ajustes para celulares menores */

        @media (max-width: 380px) {

            .box {
                padding: 25px 15px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 19px;
            }

            button {
                min-width: 105px;
                padding: 15px 18px;
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

    <div class="box">

        <div class="coracao">💌</div>

        <h1>Oi, Tharcila!</h1>

        <p>Prosposta especial do Endrewzinho</p>

        <h2>
            Topa sair comigo pra comer tonkatsu hoje? ✌🏼
        </h2>

        <p>Escolha uma resposta e arraste até a caixinha:</p>

        <div class="opcoes">

            <button id="sim">SIM ❤️</button>

            <button id="nao">NÃO 😔</button>

        </div>

        <div class="area" id="area">

            Arraste sua resposta até aqui 👇

        </div>

        <div id="resultado">

            <div style="font-size: 45px;">😍❤️</div>

            <h2>EU SABIAAA!</h2>

            <!-- <p>
                Agora só falta escolher o dia e o lugar!
            </p> -->

            <p>
                Prometo preparar um encontro bem legal pra gente.
                🥰
            </p>

            <p>
                Local: Vila Container
            </p>

        </div>

    </div>

    <script>

        const sim = document.getElementById("sim");
        const nao = document.getElementById("nao");
        const area = document.getElementById("area");
        const resultado = document.getElementById("resultado");

        // BOTÃO NÃO FOGE

        function fugir() {

            const largura = nao.offsetWidth;
            const altura = nao.offsetHeight;

            const margem = 10;

            const x = margem + Math.random() *
                (window.innerWidth - largura - margem * 2);

            const y = margem + Math.random() *
                (window.innerHeight - altura - margem * 2);

            nao.style.position = "fixed";
            nao.style.zIndex = "1000";

            // Ativa a transição antes de mudar de posição
            nao.style.left = x + "px";
            nao.style.top = y + "px";

            nao.innerText = "Tenta de novo KKKK";

        }

        // No computador, foge ao aproximar o mouse.
        nao.addEventListener("pointerenter", (event) => {

            if (event.pointerType === "mouse") {
                fugir();
            }

        });

        // No celular, foge quando tentam tocar.
        nao.addEventListener("pointerdown", (event) => {

            event.preventDefault();
            fugir();

        });


        // ARRASTAR O BOTÃO SIM

        let arrastando = false;
        let inicioX = 0;
        let inicioY = 0;

        sim.addEventListener("pointerdown", (event) => {

            arrastando = true;

            const rect = sim.getBoundingClientRect();

            inicioX = event.clientX - rect.left;
            inicioY = event.clientY - rect.top;

            sim.style.position = "fixed";
            sim.style.left = rect.left + "px";
            sim.style.top = rect.top + "px";
            sim.style.zIndex = "1001";

            sim.setPointerCapture(event.pointerId);

        });


        sim.addEventListener("pointermove", (event) => {

            if (!arrastando) return;

            sim.style.left = (event.clientX - inicioX) + "px";
            sim.style.top = (event.clientY - inicioY) + "px";

        });


        sim.addEventListener("pointerup", () => {

            if (!arrastando) return;

            arrastando = false;

            const simRect = sim.getBoundingClientRect();
            const areaRect = area.getBoundingClientRect();

            // Verifica se o botão chegou à caixinha.

            const dentro =
                simRect.left < areaRect.right &&
                simRect.right > areaRect.left &&
                simRect.top < areaRect.bottom &&
                simRect.bottom > areaRect.top;

            if (dentro) {

                document.querySelector(".opcoes").style.display = "none";

                area.style.display = "none";

                resultado.style.display = "block";

            } else {

                // Volta ao lugar original.

                sim.style.position = "static";
                sim.style.left = "auto";
                sim.style.top = "auto";
                sim.style.zIndex = "auto";

            }

        });


        sim.addEventListener("pointercancel", () => {

            arrastando = false;

            sim.style.position = "static";
            sim.style.left = "auto";
            sim.style.top = "auto";
            sim.style.zIndex = "auto";

        });

    </script>

</body>

</html>
